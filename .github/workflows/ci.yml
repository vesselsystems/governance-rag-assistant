name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Verify corpus manifest
        run: python scripts/verify_corpus_manifest.py
      - name: Run offline retrieval evaluation
        run: python scripts/evaluate_retrieval.py
      - name: Validate generation gate
        run: python scripts/validate_generation.py
      - name: Run adversarial fixture checks
        run: python scripts/evaluate_adversarial.py
      - name: Lint
        run: ruff check .
